<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}DigitAI{% endblock %}</title>
    <meta name="description" content="DigitAI MNIST Handwritten Digit Recognition" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">D</div>
          <div>
            <div class="brand-name">DigitAI</div>
            <div class="brand-tag">MNIST Handwritten Digit Recognition</div>
          </div>
        </div>
      </header>

      {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
